[build-system]
requires=["setuptools>=61","wheel"]
build-backend="setuptools.build_meta"
[project]
name="pdfx-extractor"
version="1.0.1"
description="PDF Extractor - extract text, structure & Word files from PDFs, fully local"
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="2351485 ALBERTA INC."}]
dependencies=["pdfminer.six>=20240701","PyPDF2>=3.0","python-docx>=1.0"]
[project.optional-dependencies]
api=["fastapi>=0.110","uvicorn>=0.29","python-multipart>=0.0.9"]
dev=["pytest>=8"]
[project.scripts]
pdfx="pdfx.cli:main"
pdfx-api="pdfx.api:main"
pdfx-mcp="pdfx.mcp_server:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
testpaths=["tests"]
