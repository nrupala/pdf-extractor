<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body><h1>PDF Extractor</h1>
<p class="note">Needs the local pdfx app/API running (pdfx-api, http://127.0.0.1:8765).</p>
<input type="file" id="file" accept="application/pdf">
<button id="tab">Use current tab PDF URL</button>
<select id="format"><option value="json">JSON</option><option value="txt">Text</option><option value="docx">Word (.docx)</option><option value="md">Markdown</option></select>
<button id="go">Extract</button>
<pre id="out"></pre><a id="dl" style="display:none">Download result</a>
<button id="copy" style="display:none">Copy text</button>
<script src="popup.js"></script></body></html>
